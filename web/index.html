<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Analyzer AI</title>
  <meta name="description" content="Free, private resume analyzer. Get an ATS score, line-by-line feedback, job-match keywords, and AI rewrites. Runs in your browser.">
  <meta name="theme-color" content="#5b5bf6">
  <meta property="og:title" content="Resume Analyzer AI">
  <meta property="og:description" content="ATS score, line-by-line feedback, job-match keywords and AI rewrites. Private: runs in your browser.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply theme before paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem("ra.settings.v1") || "{}");
      if (s.theme === "dark" || s.theme === "light") document.documentElement.setAttribute("data-theme", s.theme);
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to content</a>
  <header class="topbar">
    <div class="container topbar-inner">
      <a class="brand" href="#/" aria-label="Resume Analyzer AI home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" fill="url(#bm)"/><path d="M10 9h8.5a3.5 3.5 0 0 1 0 7H10zM10 16l8 7" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="22.5" r="2.2" fill="#fff"/><defs><linearGradient id="bm" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6d6af8"/><stop offset="1" stop-color="#a855f7"/></linearGradient></defs></svg>
        </span>
        <span class="brand-name">Resume Analyzer <span class="brand-ai">AI</span></span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="#/" data-nav="home">Analyze</a>
        <a href="#/history" data-nav="history">History <span class="nav-count" id="historyCount" hidden></span></a>
      </nav>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle theme">
          <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" type="button" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <div class="container footer-inner">
      <span>Resume Analyzer AI · Your resume never leaves your browser unless you run an AI action.</span>
      <a href="https://github.com/Alexm2025/resume-analyzer-ai" target="_blank" rel="noopener">Source on GitHub</a>
    </div>
  </footer>

  <dialog id="settingsDialog" class="dialog" aria-labelledby="settingsTitle">
    <form method="dialog" class="dialog-body" id="settingsForm">
      <div class="dialog-head">
        <h2 id="settingsTitle">Settings</h2>
        <button class="icon-btn" value="cancel" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="field">
        <label for="aiStatus">AI status</label>
        <div id="aiStatus" class="ai-status">Checking…</div>
      </div>
      <div class="field">
        <label for="openaiKey">OpenAI API key <span class="muted">(optional)</span></label>
        <input id="openaiKey" name="openaiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…">
        <p class="hint">Stored only in this browser and sent directly to OpenAI when you run an AI action. Get a key at <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">platform.openai.com</a>.</p>
      </div>
      <div class="field">
        <label for="model">Model</label>
        <input id="model" name="model" type="text" spellcheck="false" placeholder="gpt-5-mini">
      </div>
      <div class="field">
        <label for="themeSelect">Theme</label>
        <select id="themeSelect" name="theme">
          <option value="system">Match system</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
        </select>
      </div>
      <div class="dialog-foot">
        <button class="btn btn-ghost danger" type="button" id="clearData">Delete all saved data</button>
        <button class="btn btn-primary" value="save" id="saveSettings">Save</button>
      </div>
    </form>
  </dialog>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
