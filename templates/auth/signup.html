{% extends "base.html" %}

{% block title %}Sign Up | Resume Analyzer AI{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="surface-card auth-card">
        <span class="eyebrow">Create account</span>
        <h1>Start analyzing resumes in minutes</h1>
        <form method="post" class="form-stack">
            <label>
                <span>Full name</span>
                <input type="text" name="full_name" placeholder="Alex Morgan" required>
            </label>
            <label>
                <span>Email</span>
                <input type="email" name="email" placeholder="name@example.com" required>
            </label>
            <label>
                <span>Password</span>
                <input type="password" name="password" placeholder="Minimum 8 characters" required>
            </label>
            <label>
                <span>Confirm password</span>
                <input type="password" name="confirm_password" placeholder="Repeat your password" required>
            </label>
            <button type="submit" class="btn">Create account</button>
        </form>
        <p class="muted-copy">Already registered? <a href="{{ url_for('auth.login') }}">Login instead</a>.</p>
    </div>
</section>
{% endblock %}
